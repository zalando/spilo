version: "2.1"

networks:
    demo:

services:
    seaweedfs:
        image: chrislusf/seaweedfs:4.48
        networks: [ demo ]
        environment:
            AWS_ACCESS_KEY_ID: &access_key Eeghei0uVej1Wea8mato
            AWS_SECRET_ACCESS_KEY: &secret_key lecheidohbah7aThohziezah3iev7ima4eeXu9gu
            S3_BUCKET: &bucket testbucket
        hostname: seaweedfs
        container_name: demo-seaweedfs
        command: mini -dir=/data -s3.port=9000

    etcd:
        image: ${SPILO_TEST_IMAGE:-spilo}
        networks: [ demo ]
        container_name: demo-etcd
        hostname: etcd
        command: "sh -c 'export ETCD_UNSUPPORTED_ARCH=$$(dpkg --print-architecture) && exec etcd -name etcd1 -listen-client-urls http://0.0.0.0:2379 -advertise-client-urls http://$$(hostname --ip-address):2379'"

    spilo1: &spilo
        depends_on: [ seaweedfs ]
        image: ${SPILO_TEST_IMAGE:-spilo}
        networks: [ demo ]
        environment:
            SPILO_PROVIDER: 'local'
            AWS_ACCESS_KEY_ID: *access_key
            AWS_SECRET_ACCESS_KEY: *secret_key
            AWS_ENDPOINT: &aws_endpoint 'http://seaweedfs:9000'
            AWS_S3_FORCE_PATH_STYLE: &aws_s3_force_path_style 'true'
            WAL_S3_BUCKET: *bucket
            WALG_DISABLE_S3_SSE: &walg_disable_s3_sse 'true'
            ETCDCTL_ENDPOINTS: http://etcd:2379
            ETCD3_HOST: "etcd:2379"
            SCOPE: demo
            ENABLE_PG_MON: 'true'
            ENABLE_PG_TEXTSEARCH: 'true'
            SPILO_CONFIGURATION: |
              bootstrap:
                dcs:
                  loop_wait: 2
                  postgresql:
                    parameters:
                      wal_decode_buffer_size: '521kB'
                      wal_keep_segments: 8
                      jit: 'off'
              postgresql:
                parameters:
                  shared_buffers: 32MB
            PGVERSION: '14'
            # Just to test upgrade with clone. Without CLONE_SCOPE they don't work
            CLONE_WAL_S3_BUCKET: *bucket
            CLONE_AWS_ACCESS_KEY_ID: *access_key
            CLONE_AWS_SECRET_ACCESS_KEY: *secret_key
            CLONE_AWS_ENDPOINT: *aws_endpoint
            CLONE_AWS_S3_FORCE_PATH_STYLE: *aws_s3_force_path_style
            CLONE_WALG_DISABLE_S3_SSE: *walg_disable_s3_sse
        hostname: spilo1
        container_name: demo-spilo1

    spilo2:
        <<: *spilo
        hostname: spilo2
        container_name: demo-spilo2

    spilo3:
        <<: *spilo
        hostname: spilo3
        container_name: demo-spilo3
